# Repository C++ formatting rules.  Keep this file small so it is easy to
# mirror in an editor or CI formatter configuration.
newlines = lf
input_tab_size = 2
output_tab_size = 2
indent_with_tabs = 0
indent_columns = 2
indent_class = true
indent_switch_case = 2
indent_namespace = false
indent_member = 2
indent_access_spec = -2
indent_access_spec_body = true
sp_before_ptr_star = force
sp_after_ptr_star = remove
sp_before_byref = force
sp_after_byref = remove
sp_after_comma = force
sp_inside_paren = remove
sp_inside_braces = remove
nl_after_semicolon = true
nl_fdef_brace = add
nl_if_brace = add
nl_for_brace = add
nl_while_brace = add
nl_switch_brace = add
nl_else_brace = add
nl_do_brace = add
nl_brace_else = add
nl_brace_catch = add
nl_func_var_def_blk = 1
nl_max = 2
mod_full_brace_if = add
mod_full_brace_for = add
mod_full_brace_while = add
mod_full_brace_do = add
mod_remove_extra_semicolon = true
align_var_def_star_style = 0
align_var_def_amp_style = 0
