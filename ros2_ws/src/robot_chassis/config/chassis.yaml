base_serial_node:
  ros__parameters:
    # Keep both false until the STM32 protocol, port, and safety checks are verified.
    serial_device: /dev/stm32_chassis
    baud_rate: 115200
    dry_run: false
    allow_motion: true
    command_timeout_s: 0.20
    publish_rate_hz: 20.0
    # Wheel order: A left-rear, B left-front, C right-front, D right-rear.
    # The STM32 command values are signed mm/s integers.
    wheel_diameter_m: 0.075
    wheel_base_m: 0.170
    track_width_m: 0.186
    encoder_counts_per_wheel_rev: 1560.0
    max_wheel_speed_mps: 1.0
    feedback_timeout_s: 0.30
    wheel_sign_a: 1
    wheel_sign_b: 1
    wheel_sign_c: 1
    wheel_sign_d: 1

row_navigation_node:
  ros__parameters:
    loop_hz: 20.0
    sensor_timeout_s: 0.30
    side_kp: 1.2
    yaw_kp: 1.0
    yaw_ki: 0.05
    yaw_integral_limit: 0.5
    max_acceleration_mps2: 0.8
    max_deceleration_mps2: 0.8
    ultrasonic_filter_window: 3
    shift_wall_enable_tolerance_m: 0.10
    shift_wall_cancel_side_distance_m: 0.25
    shift_wall_cancel_side_tolerance_m: 0.02
    max_lateral_speed_mps: 0.15
    max_yaw_rate_rad_s: 0.40
    stop_speed_epsilon_mps: 0.03
    stop_angular_epsilon_rad_s: 0.08
    stop_settle_s: 0.20
    default_front_slow_m: 0.30
    default_front_stop_m: 0.05
    default_safety_distance_m: 0.05
    reverse_distance_m: 0.75
    reverse_distance_tolerance_m: 0.05
    reverse_slow_distance_m: 0.25
    shift_side_target_m: 0.05
    shift_side_slow_distance_m: 0.50
    shift_front_target_m: 0.05
    shift_front_kp: 1.0
    max_front_correction_mps: 0.08
    mango_brake_time_s: 0.35


mission_behavior_node:
  ros__parameters:
    row_count: 7
    step_count: 15
    row_speed_mps: 0.20
    shift_distance_m: 0.30
    shift_speed_mps: 0.10
    row_side_target_m: 0.05
    front_slow_distance_m: 0.30
    front_stop_distance_m: 0.05
    shift_safety_distance_m: 0.05
    reverse_distance_m: 0.70
    shift_by_side_wall: true
    hold_front_distance: true
    shift_front_target_m: 0.05
    shift_side_slow_distance_m: 0.50
    shift_wall_target_m: 0.05
    shift_wall_enable_tolerance_m: 0.10
    shift_disable_wall_control_on_side_distance: false
    shift_wall_control_cancel_side_distance_m: 0.25
    shift_wall_control_cancel_side_tolerance_m: 0.02
    reverse_stop_on_zero_velocity: true
    # Shift steps 1..7 correspond to route indices 1,3,5,7,9,11,13.
    # 0=none, 1=front, 2=rear. These scalar params are editable in rqt.
    shift_wall_sensor_step_1: 1
    shift_wall_sensor_step_2: 1
    shift_wall_sensor_step_3: 1
    shift_wall_sensor_step_4: 1
    shift_wall_sensor_step_5: 1
    shift_wall_sensor_step_6: 1
    shift_wall_sensor_step_7: 1
    shift_wall_cancel_step_1: false
    shift_wall_cancel_step_2: false
    shift_wall_cancel_step_3: false
    shift_wall_cancel_step_4: false
    shift_wall_cancel_step_5: false
    shift_wall_cancel_step_6: false
    shift_wall_cancel_step_7: false
    # Reverse steps 1..7 correspond to route indices 2,4,6,8,10,12,14.
    reverse_stop_zero_step_1: true
    reverse_stop_zero_step_2: true
    reverse_stop_zero_step_3: true
    reverse_stop_zero_step_4: true
    reverse_stop_zero_step_5: true
    reverse_stop_zero_step_6: true
    reverse_stop_zero_step_7: true
    mango_min_confidence: 0.75
    mango_stable_frames: 3
    mango_timeout_s: 0.50
    mango_rearm_delay_s: 1.0
    mango_min_distance_m: 0.30
    mango_max_distance_m: 1.50
    mango_center_tolerance_m: 0.10
    mango_approach_height_m: 0.10
    mango_grasp_offset_x_m: 0.0
    mango_grasp_offset_y_m: 0.0
    mango_grasp_offset_z_m: 0.0
    mango_tool_tilt_rad: 1.5
    mango_joint5_rad: 0.0
    pick_duration_s: 2.0
    pick_return_home: true
    tick_hz: 20.0
